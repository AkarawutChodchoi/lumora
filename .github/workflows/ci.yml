name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lumora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/lumora_test
      DIRECT_URL: postgresql://postgres:ci@localhost:5432/lumora_test
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/lumora_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
